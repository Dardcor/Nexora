name: Release Nexora

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-release:
    name: Clean Old Releases
    runs-on: ubuntu-latest
    steps:
      - name: Clean up previous release tags if recreating
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.1.1 --yes || true
          gh release delete ${{ github.ref_name }} --yes || true
          gh release create ${{ github.ref_name }} --title "Nexora ${{ github.ref_name }}" --generate-notes

  build-desktop:
    name: Build Desktop - ${{ matrix.target }}
    needs: clean-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: nexora.exe
            is_windows: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: nexora
            is_windows: false
            platform_prefix: nexora-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: nexora
            is_windows: false
            platform_prefix: nexora-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: nexora
            is_windows: false
            platform_prefix: nexora-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Windows Executable (No ZIP)
        if: matrix.is_windows == true
        shell: pwsh
        run: |
          Copy-Item -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination "nexora-windows-x64.exe"

      - name: Prepare Unix Binaries
        if: matrix.is_windows == false
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.platform_prefix }}
          tar -czvf ${{ matrix.platform_prefix }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}

      - name: Upload Windows Direct Executable
        uses: softprops/action-gh-release@v2
        if: matrix.is_windows == true && startsWith(github.ref, 'refs/tags/')
        with:
          files: nexora-windows-x64.exe
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload Unix Binaries
        uses: softprops/action-gh-release@v2
        if: matrix.is_windows == false && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.platform_prefix }}
            ${{ matrix.platform_prefix }}.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true

  build-android:
    name: Build Mobile - Android
    needs: clean-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Android Core Shared Libraries
        run: |
          mkdir -p android_dist/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android_dist/jniLibs rustc --release --lib -- --crate-type cdylib

      - name: Package Android Artifacts
        run: |
          cp android_dist/jniLibs/arm64-v8a/libnexora.so nexora-android-arm64.so
          tar -czvf nexora-android-all-archs.tar.gz -C android_dist jniLibs

      - name: Upload Android Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            nexora-android-arm64.so
            nexora-android-all-archs.tar.gz
          draft: false
          prerelease: false
