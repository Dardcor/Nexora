<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Toolbar</title>
    <link rel="stylesheet" href="toolbar.css">
</head>
<body>
    <header class="nexora-chrome">
        <!-- Row 1: Chrome Horizontal Tab Strip (Top-most) -->
        <div class="tab-strip-row" id="tab-strip-row">
            <button class="tab-dropdown-btn" id="btn-tab-menu" title="Search Tabs" aria-label="Tab menu">
                <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                </svg>
            </button>

            <div class="tab-strip" id="tab-strip" role="tablist" aria-label="Open tabs">
                <!-- Dynamically rendered tabs -->
            </div>

            <button class="new-tab-btn" id="btn-new-tab" title="New Tab (Ctrl+T)" aria-label="New tab">
                <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2Z"/>
                </svg>
            </button>

            <div class="window-drag-spacer" id="drag-spacer"></div>

            <!-- Native Window Caption Controls -->
            <div class="window-controls" id="window-controls">
                <button class="win-btn win-btn-min" id="btn-win-min" title="Minimize" aria-label="Minimize">
                    <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
                </button>
                <button class="win-btn win-btn-max" id="btn-win-max" title="Maximize" aria-label="Maximize">
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="9" height="9"/></svg>
                </button>
                <button class="win-btn win-btn-close" id="btn-win-close" title="Close" aria-label="Close">
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
                        <line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Row 2: Navigation & Omnibox URL Bar -->
        <div class="nav-bar-row">
            <div class="nav-actions">
                <button class="nav-circle-btn" id="btn-back" title="Click to go back (Alt+Left)" aria-label="Back">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M9.78 12.78a.75.75 0 0 1-1.06 0L4.47 8.53a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 1.06L6.06 8l3.72 3.72a.75.75 0 0 1 0 1.06Z"/>
                    </svg>
                </button>
                <button class="nav-circle-btn" id="btn-forward" title="Click to go forward (Alt+Right)" aria-label="Forward">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/>
                    </svg>
                </button>
                <button class="nav-circle-btn" id="btn-reload" title="Reload this page (Ctrl+R)" aria-label="Reload">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.001 7.001 0 0 1 14.95 7.16a.75.75 0 1 1-1.49.178A5.5 5.5 0 0 0 8 2.5ZM1.05 8.84a.75.75 0 0 1 1.49-.178A5.5 5.5 0 0 0 8 13.5a5.487 5.487 0 0 0 4.131-1.869l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.001 7.001 0 0 1 1.05 8.84Z"/>
                    </svg>
                </button>
            </div>

            <!-- Full-Width Omnibox -->
            <form class="omnibox-form" id="omnibox-form">
                <div class="omnibox-shell" id="omnibox-shell">
                    <button type="button" class="omnibox-left-btn" id="btn-site-info" title="View site information" aria-label="Site security">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                            <path d="M1 3.5a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 0 1.5h-1.5A.75.75 0 0 1 1 3.5Zm4.5 0a1.75 1.75 0 1 1 3.5 0 1.75 1.75 0 0 1-3.5 0Zm4.25.75a.75.75 0 0 0 0-1.5h-1.5a.75.75 0 0 0 0 1.5h1.5ZM1 8a.75.75 0 0 1 .75-.75h6.5a.75.75 0 0 1 0 1.5h-6.5A.75.75 0 0 1 1 8Zm9.5-1.75a1.75 1.75 0 1 0 0 3.5 1.75 1.75 0 0 0 0-3.5ZM13 8.75a.75.75 0 0 0 0-1.5h-1.5a.75.75 0 0 0 0 1.5h1.5ZM1 12.5a.75.75 0 0 1 .75-.75h3.5a.75.75 0 0 1 0 1.5h-3.5a.75.75 0 0 1-.75-.75Zm6.5-1.75a1.75 1.75 0 1 0 0 3.5 1.75 1.75 0 0 0 0-3.5ZM10 13.25a.75.75 0 0 0 0-1.5h-1.5a.75.75 0 0 0 0 1.5h1.5Z"/>
                        </svg>
                    </button>

                    <input 
                        type="text" 
                        class="omnibox-input" 
                        id="omnibox-input" 
                        placeholder="Search or type a URL" 
                        autocomplete="off" 
                        spellcheck="false"
                        aria-label="Address and search"
                    >

                    <div class="omnibox-right-tools">
                        <button type="button" class="omnibox-tool-btn" id="btn-star" title="Bookmark this tab (Ctrl+D)" aria-label="Bookmark">
                            <svg class="star-icon" id="star-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                                <path d="m8 1.75 2.122 4.298 4.745.69-3.434 3.346.81 4.726L8 12.585l-4.243 2.225.81-4.726L1.133 6.738l4.745-.69L8 1.75Zm0 2.45L6.611 7.005l-3.106.452 2.248 2.19-.53 3.093L8 11.282l2.777 1.458-.53-3.093 2.248-2.19-3.106-.452L8 4.2Z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Omnibox Autocomplete Dropdown -->
                <div class="omnibox-dropdown" id="omnibox-dropdown">
                    <!-- Dynamic autocomplete matches -->
                </div>
            </form>

            <!-- Profile & Menu Actions -->
            <div class="profile-actions">
                <button class="shield-pill-btn" id="btn-shield" title="Nexora Shield Protection Active" aria-label="Shield status">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="m8.47 1.077 5.5 2.2a.75.75 0 0 1 .47.697v4.776c0 3.967-2.67 7.025-5.94 8.2a.75.75 0 0 1-.56 0C4.67 15.775 2 12.717 2 8.75V3.974a.75.75 0 0 1 .47-.697l5.5-2.2a.75.75 0 0 1 .56 0ZM3.5 4.542v4.208c0 3.256 2.127 5.86 4.5 6.942 2.373-1.082 4.5-3.686 4.5-6.942V4.542L8 2.742 3.5 4.542Z"/>
                    </svg>
                    <span class="shield-badge-text" id="shield-count">0</span>
                </button>

                <img class="profile-avatar" id="profile-avatar" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAhzSURBVFhH7dZ5VFZ1GsDx515eEYEXldhkEdReFEWBFBxccElSUmNwQ9BARHHXDCUQDDNc0tJQQU2dQktAcmvcxZpJTcujUowbojJZiLhgQiC8732/c3TOmXN67TTV6c8+f9/f871/3PvcK/Kn3yFySj/v55e91q/TyuVRjm8sG2E9P62/9aRwH8vr/lCLD+7tPOns+aUR/yw/H7zn+4aOBbW4bW7CblUjzV6/jzqr/JEu6etvbCafect59t6ulud/t4sXK9xSH/zw3vDrPzb5noDm60EWgmSATGtAht9E+lxEup9DAs+h9ryMdZ9Sk8MLV99vP+ErT8t5v8m+uobBiU2m77rcA8kHyTYheaArAnVOOUroYZTORYghH2m3A/HahrhsRJzysPI5jT6wospn8I/DLef+KgX1jbGjTWat5X2QIxpyUMPuHDh90YD1sA+R1osQtxVI282IRw5Kq1dQbEYjzf6KNI9BbJJQ7Ffi4HOKZ0NvJFjO/0WFDcZBY0xmWteCetGErkTDvRL8y2ux674AkfGI8xtI2w8Qx3mIBCPij0gEIlMRWYRYZSNW65FmeTi6naZjl6+GWXZ+VonZ7BzdaLrt9gha3DRhd8OEV5WZAfUa7uEZiLyIOC9GvAoRGYVIVxw9kvAfnkevV0/RP+sa/bJuEfraXQLi7uDT6ztaudzE2fHq/W6GYnfL3lNG1Bq3eADWj+PfmvCqNBEO9F21C5EBiFMW0v4w+jbTGBS7kJRDZax8AMuaIPk2TLkMcach9ijE7oVxW81ELzbS73lo3/JGvmXvJ2aYzQb3u5pJrplRL5twuG7C/z7E363Dpf3LiP18JOAs0imPiHnHmLztFlG5XzN0+TESNh0n/WQNi0vhlc9gYpGRuPeNxKwzErfaSHq2mWkjH+Esv/CKelcZl6sVICc0lDMajmUazxsh9pNTiM047AeeoGvaQ9L33mFtOSScaSB4Ry3PzK/AOnQH7r7xRMVlsmZHJQWnYEURvJZrZM4yI7NTm9i2BBZFla6x7D6RQYZiXWIslYMguzXUYg3nbzSizDB0RRHS5k1m5j/iViOcBeLLzHTYBbZpJqxGPEIZ0oAYvkSkB/rmwSSOz+Pzg3Uc3QPr3mkiK7WJ7NmwY3bl1cy+YmXZF3tueav/MDXK40WzSUMt1HA8oTGkHl546xPch+yl9CFcQmNshYbr470QVY10K0EJKUd6P0AMJYhLLiKdnjysHdtN4vDmK5TtgoJMI2smQUFCvXZw6h5fy74opTX9rb4AWQGyVEPN0dDv0gj4N0QUnqdb7DE21MFL1zQ8CsFqVCXS6RCKzy6Unt+jdL2AeBUhLtmoLYbi0iwekWgc7IZTvOpf3FgP2ydq7I6B4oTyIZZ9UT+uGaHLB9vNGjJXQ9I0dKtN2B+Cbl/doeusz3nuM7BdBhJ2E3HLQ1yXo7hvRGm3E8UhBcU5C2n1CmIXRaBDKs7KQqwkEo/W0VxYcpcTSWb2RcKBkTfHWfal2fs1IyQZ7NM1nnnbjCSYkSkmZIWGzZdg2HsPXWwTElKNeO1HafMuSqtkxGEuiu0kFJuxKHbjEYdEdPoxxPkU4CbLcVJmIhJO/HOruJwEB8Nh35DKp2/AOrdmgJoI0usBrWLu4DGvkRaTQJJAVpuxPQsOcZcQZSXSZgPi/TcUlyUo+imI3QTEPgFFn4i0nENIxyXkBl/FVdbirqbSWhJx1o1lzwvVFPeBA2GVEZZ9aVl4y0cdb2qSwNtI2+PY+B7GPbIEtzl12C0B2Qq6I0ZsRmxBUaMRdQJiN                 <!-- Chrome 3-Dot More Menu Button -->
                <button class="nav-circle-btn" id="btn-more-menu" title="Customize and control Nexora" aria-label="Menu">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path d="M8 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM8 4a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM8 14a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Row 3: Chrome Bookmarks Bar -->
        <div class="bookmarks-bar-row" id="bookmarks-bar-row">
            <div class="bookmarks-list" id="bookmarks-bar-list">
                <!-- Bookmarks chips rendered dynamically from SQLite -->
            </div>
        </div>
    </header>

    <!-- Chrome 3-Dot Dropdown Menu -->
    <div class="more-menu-dropdown" id="more-menu-dropdown">
        <div class="menu-item" id="menu-new-tab">
            <span>New tab</span>
            <span class="menu-shortcut">Ctrl+T</span>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menu-history">
            <span>History</span>
            <span class="menu-shortcut">Ctrl+H</span>
        </div>
        <div class="menu-item" id="menu-bookmarks">
            <span>Bookmarks</span>
            <span class="menu-shortcut">Ctrl+Shift+O</span>
        </div>
        <div class="menu-item" id="menu-downloads">
            <span>Downloads</span>
            <span class="menu-shortcut">Ctrl+J</span>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item-row">
            <span>Zoom</span>
            <div class="zoom-controls">
                <button type="button" class="zoom-btn" id="zoom-minus" title="Zoom out">-</button>
                <span class="zoom-level" id="zoom-level">100%</span>
                <button type="button" class="zoom-btn" id="zoom-plus" title="Zoom in">+</button>
            </div>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menu-settings">
            <span>Settings</span>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menu-exit">
            <span>Exit</span>
        </div>
    </div>

    <!-- Security Popover -->
    <div class="security-popover" id="security-popover">
        <div class="popover-header">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="#23a55a" aria-hidden="true">
                <path fill-rule="evenodd" d="m8.47 1.077 5.5 2.2a.75.75 0 0 1 .47.697v4.776c0 3.967-2.67 7.025-5.94 8.2a.75.75 0 0 1-.56 0C4.67 15.775 2 12.717 2 8.75V3.974a.75.75 0 0 1 .47-.697l5.5-2.2a.75.75 0 0 1 .56 0ZM3.5 4.542v4.208c0 3.256 2.127 5.86 4.5 6.942 2.373-1.082 4.5-3.686 4.5-6.942V4.542L8 2.742 3.5 4.542Z"/>
            </svg>
            <span class="popover-title">Connection is secure</span>
        </div>
        <div class="popover-body">
            <div class="popover-stat">
                <span class="stat-label">Nexora Shield</span>
                <span class="stat-val" id="popover-shield-val">Active (0 blocked)</span>
            </div>
            <div class="popover-stat">
                <span class="stat-label">Local SQLite Database</span>
                <span class="stat-val status-green">Offline &amp; Encrypted</span>
            </div>
            <div class="popover-stat">
                <span class="stat-label">Fingerprint Resistance</span>
                <span class="stat-val status-green">Strict</span>
            </div>
        </div>
    </div>

    <script src="toolbar.js"></script>
</body>
</html>
