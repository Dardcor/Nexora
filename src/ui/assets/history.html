<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Nexora</title>
    <style>
        :root {
            --bg-base: #1e1f22;
            --bg-surface: #2b2d31;
            --bg-hover: #35373c;
            --border-subtle: #383a40;
            --text-primary: #f2f3f5;
            --text-secondary: #949ba4;
            --accent-blue: #5865f2;
            --accent-red: #da373c;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-stack);
            font-size: 13px;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .history-sidebar {
            width: 250px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-subtle);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex-shrink: 0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .sidebar-brand svg {
            color: var(--accent-blue);
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.1s ease, color 0.1s ease;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background-color: rgba(88, 101, 242, 0.15);
            color: var(--accent-blue);
        }

        .sidebar-footer {
            margin-top: auto;
        }

        .btn-clear-all {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--accent-red);
            background: transparent;
            color: var(--accent-red);
            font-weight: 500;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.1s ease, color 0.1s ease;
        }

        .btn-clear-all:hover {
            background: var(--accent-red);
            color: #ffffff;
        }

        /* Main Content */
        .history-main {
            flex: 1;
            padding: 2rem 2.5rem;
            overflow-y: auto;
            max-width: 900px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .history-title {
            font-size: 20px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 6px 12px;
            gap: 8px;
            width: 320px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 13px;
            width: 100%;
        }

        .search-box svg {
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .history-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .history-item-row {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            gap: 14px;
            transition: background 0.1s ease;
        }

        .history-item-row:last-child {
            border-bottom: none;
        }

        .history-item-row:hover {
            background-color: var(--bg-hover);
        }

        .item-time {
            color: var(--text-secondary);
            font-size: 12px;
            width: 70px;
            flex-shrink: 0;
        }

        .item-globe {
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-title {
            color: var(--text-primary);
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .item-title:hover {
            text-decoration: underline;
            color: var(--accent-blue);
        }

        .item-url {
            color: var(--text-secondary);
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-count {
            font-size: 11px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .item-delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.1s ease, color 0.1s ease;
        }

        .history-item-row:hover .item-delete-btn {
            opacity: 1;
        }

        .item-delete-btn:hover {
            color: var(--accent-red);
        }

        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <aside class="history-sidebar">
        <div class="sidebar-brand">
            <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0Zm7-4.75a.75.75 0 0 0-1.5 0v5c0 .414.336.75.75.75h3.5a.75.75 0 0 0 0-1.5h-2.75V3.25Z"/>
            </svg>
            <span>History</span>
        </div>
        <nav class="sidebar-menu">
            <a class="sidebar-item active" href="nexora://history">Chrome History</a>
            <a class="sidebar-item" href="nexora://bookmarks">Bookmarks</a>
            <a class="sidebar-item" href="nexora://downloads">Downloads</a>
            <a class="sidebar-item" href="nexora://settings">Settings</a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-clear-all" id="btn-clear-history">Clear Browsing Data</button>
        </div>
    </aside>

    <main class="history-main">
        <header class="history-header">
            <h1 class="history-title">Browsing History</h1>
            <div class="search-box">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/>
                </svg>
                <input type="text" id="history-search" placeholder="Search history..." autocomplete="off">
            </div>
        </header>

        <section class="history-card" id="history-list">
            <!-- Dynamically populated from SQLite -->
        </section>
    </main>

    <script>
        function sendIpc(msg) {
            if (window.ipc) {
                window.ipc.postMessage(JSON.stringify(msg));
            }
        }

        const historyList = document.getElementById('history-list');
        const searchInput = document.getElementById('history-search');
        const btnClear = document.getElementById('btn-clear-history');

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderHistory(records) {
            if (!records || records.length === 0) {
                historyList.innerHTML = '<div class="empty-state">No browsing history found.</div>';
                return;
            }

            historyList.innerHTML = '';
            records.forEach(item => {
                const row = document.createElement('div');
                row.className = 'history-item-row';
                row.innerHTML = `
                    <span class="item-time">${formatTime(item.visit_time)}</span>
                    <svg class="item-globe" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0Zm7-5.46v10.92a6.51 6.51 0 0 1-3.25-1.46 6.51 6.51 0 0 1 0-8 6.51 6.51 0 0 1 3.25-1.46Z"/>
                    </svg>
                    <div class="item-details">
                        <span class="item-title" title="${item.title}">${item.title || item.url}</span>
                        <span class="item-url">${item.url}</span>
                    </div>
                    ${item.visit_count > 1 ? `<span class="item-count">${item.visit_count} visits</span>` : ''}
                    <button class="item-delete-btn" title="Remove from history" data-id="${item.id}">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/>
                        </svg>
                    </button>
                `;

                row.querySelector('.item-title').addEventListener('click', () => {
                    sendIpc({ type: 'navigate', url: item.url });
                });

                row.querySelector('.item-delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    sendIpc({ type: 'delete_history', id: item.id });
                    row.remove();
                });

                historyList.appendChild(row);
            });
        }

        window.__nexora_render_history = renderHistory;

        searchInput.addEventListener('input', (e) => {
            sendIpc({ type: 'get_history', query: e.target.value });
        });

        btnClear.addEventListener('click', () => {
            if (confirm('Clear all browsing history from your local SQLite database?')) {
                sendIpc({ type: 'clear_history' });
                historyList.innerHTML = '<div class="empty-state">Browsing history cleared.</div>';
            }
        });

        // Request initial history
        sendIpc({ type: 'get_history', query: '' });
    </script>
</body>
</html>
