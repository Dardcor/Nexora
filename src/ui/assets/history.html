<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Nexora</title>
    <style>
        :root {
            --bg-base: #1e1f22;
            --bg-surface: #2b2d31;
            --bg-hover: #35373c;
            --border-subtle: #383a40;
            --text-primary: #f2f3f5;
            --text-secondary: #949ba4;
            --accent-blue: #5865f2;
            --accent-red: #da373c;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-stack);
            font-size: 13px;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .history-sidebar {
            width: 250px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-subtle);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex-shrink: 0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .sidebar-brand svg {
            color: var(--accent-blue);
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.1s ease, color 0.1s ease;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background-color: rgba(88, 101, 242, 0.15);
            color: var(--accent-blue);
        }

        /* Main Content */
        .history-main {
            flex: 1;
            padding: 2rem 2.5rem;
            overflow-y: auto;
            max-width: 900px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .history-title {
            font-size: 20px;
            font-weight: 600;
        }

        .history-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-input {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            width: 260px;
            transition: border-color 0.15s ease;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
        }

        .btn-clear {
            background-color: rgba(218, 55, 60, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(218, 55, 60, 0.3);
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-clear:hover {
            background-color: rgba(218, 55, 60, 0.25);
        }

        /* History List */
        .history-list {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
        }

        .history-item-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            gap: 14px;
            transition: background 0.1s ease;
        }

        .history-item-row:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .history-item-row:last-child {
            border-bottom: none;
        }

        .item-time {
            font-size: 12px;
            color: var(--text-secondary);
            width: 60px;
            flex-shrink: 0;
        }

        .item-favicon {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .item-globe {
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-title {
            color: var(--text-primary);
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .item-title:hover {
            text-decoration: underline;
            color: var(--accent-blue);
        }

        .item-url {
            color: var(--text-secondary);
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-count {
            font-size: 11px;
            color: var(--accent-blue);
            background: rgba(88, 101, 242, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .item-delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.1s ease, color 0.1s ease;
        }

        .history-item-row:hover .item-delete-btn {
            opacity: 1;
        }

        .item-delete-btn:hover {
            color: var(--accent-red);
            background-color: rgba(218, 55, 60, 0.1);
        }

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <aside class="history-sidebar">
        <div class="sidebar-brand">
            <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8.515 1.019A7 7 0 0 0 8 1a7 7 0 1 0 7 7h-1.5a5.5 5.5 0 1 1-5.5-5.5v2.5l3.5-3.5L8 0v1.019ZM8 4.5a.75.75 0 0 1 .75.75v2.69l1.72 1.72a.75.75 0 1 1-1.06 1.06l-2-2A.75.75 0 0 1 7.25 8V5.25A.75.75 0 0 1 8 4.5Z"/>
            </svg>
            <span>History</span>
        </div>
        <nav class="sidebar-menu">
            <a class="sidebar-item active" href="javascript:void(0)" onclick="sendIpc({ type: 'navigate', url: 'nexora://history' })">Browsing History</a>
            <a class="sidebar-item" href="javascript:void(0)" onclick="sendIpc({ type: 'navigate', url: 'nexora://bookmarks' })">Bookmarks</a>
            <a class="sidebar-item" href="javascript:void(0)" onclick="sendIpc({ type: 'navigate', url: 'nexora://downloads' })">Downloads</a>
            <a class="sidebar-item" href="javascript:void(0)" onclick="sendIpc({ type: 'navigate', url: 'nexora://settings' })">Settings</a>
        </nav>
    </aside>

    <main class="history-main">
        <header class="history-header">
            <h1 class="history-title">Browsing History</h1>
            <div class="history-actions">
                <input type="text" class="search-input" id="history-search" placeholder="Search history..." autocomplete="off">
                <button class="btn-clear" id="btn-clear-history">Clear History</button>
            </div>
        </header>

        <div class="history-list" id="history-list">
            <div class="empty-state">Loading history...</div>
        </div>
    </main>

    <script>
        function sendIpc(msg) {
            if (window.ipc) {
                window.ipc.postMessage(JSON.stringify(msg));
            }
        }

        function getDomain(url) {
            if (!url) return '';
            try { return new URL(url).hostname; } catch(e) { return ''; }
        }

        const historyList = document.getElementById('history-list');
        const searchInput = document.getElementById('history-search');
        const btnClear = document.getElementById('btn-clear-history');

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderHistory(records) {
            if (!records || records.length === 0) {
                historyList.innerHTML = '<div class="empty-state">No browsing history found.</div>';
                return;
            }

            historyList.innerHTML = '';
            records.forEach(item => {
                const row = document.createElement('div');
                row.className = 'history-item-row';
                const domain = getDomain(item.url);
                const faviconSrc = domain ? `https://www.google.com/s2/favicons?domain=${domain}&sz=32` : '';

                let iconHtml = '';
                if (faviconSrc) {
                    iconHtml = `
                        <img class="item-favicon" src="${faviconSrc}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                        <svg class="item-globe" style="display:none;" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0Zm7-5.46v10.92a6.51 6.51 0 0 1-3.25-1.46 6.51 6.51 0 0 1 0-8 6.51 6.51 0 0 1 3.25-1.46Z"/>
                        </svg>
                    `;
                } else {
                    iconHtml = `
                        <svg class="item-globe" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0Zm7-5.46v10.92a6.51 6.51 0 0 1-3.25-1.46 6.51 6.51 0 0 1 0-8 6.51 6.51 0 0 1 3.25-1.46Z"/>
                        </svg>
                    `;
                }

                row.innerHTML = `
                    <span class="item-time">${formatTime(item.visit_time)}</span>
                    ${iconHtml}
                    <div class="item-details">
                        <span class="item-title" title="${item.title}">${item.title || item.url}</span>
                        <span class="item-url">${item.url}</span>
                    </div>
                    ${item.visit_count > 1 ? `<span class="item-count">${item.visit_count} visits</span>` : ''}
                    <button class="item-delete-btn" title="Remove from history" data-id="${item.id}">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/>
                        </svg>
                    </button>
                `;

                row.querySelector('.item-title').addEventListener('click', () => {
                    sendIpc({ type: 'navigate', url: item.url });
                });

                row.querySelector('.item-delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    sendIpc({ type: 'delete_history', id: item.id });
                    row.remove();
                });

                historyList.appendChild(row);
            });
        }

        window.__nexora_render_history = renderHistory;

        searchInput.addEventListener('input', (e) => {
            sendIpc({ type: 'get_history', query: e.target.value });
        });

        btnClear.addEventListener('click', () => {
            if (confirm('Clear all browsing history from your local SQLite database?')) {
                sendIpc({ type: 'clear_history' });
                historyList.innerHTML = '<div class="empty-state">Browsing history cleared.</div>';
            }
        });

        // Request initial history
        sendIpc({ type: 'get_history', query: '' });
    </script>
</body>
</html>
