<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Home</title>
    <style>
        :root {
            --bg-base: #0d1117;
            --bg-surface: #161b22;
            --bg-elevated: #21262d;
            --border-color: #30363d;
            --border-focus: #58a6ff;
            --text-primary: #f0f6fc;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-stack);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            user-select: none;
        }

        .home-container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.25rem;
        }

        /* Brand Wordmark */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
        }

        .brand-logo-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            color: var(--accent-blue);
        }

        .brand-name {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #ffffff;
        }

        .brand-badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-green);
            background-color: rgba(63, 185, 80, 0.12);
            border: 1px solid rgba(63, 185, 80, 0.3);
            border-radius: 4px;
            padding: 2px 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .brand-tagline {
            font-size: 0.9rem;
            color: var(--text-muted);
            max-width: 420px;
            line-height: 1.45;
        }

        /* Search & Navigation Bar */
        .search-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0 12px;
            gap: 10px;
            height: 48px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .search-box:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
        }

        .search-icon {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-engine-select {
            background-color: var(--bg-elevated);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: color 0.1s ease, border-color 0.1s ease;
        }

        .search-engine-select:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        /* Quick Navigation Tiles */
        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
        }

        .shortcut-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.1s ease;
        }

        .shortcut-card:hover {
            background-color: var(--bg-elevated);
            border-color: var(--text-muted);
            transform: translateY(-1px);
        }

        .shortcut-icon {
            width: 22px;
            height: 22px;
            color: var(--accent-blue);
        }

        .shortcut-title {
            font-size: 12px;
            font-weight: 500;
        }

        /* Status & Privacy Guarantee Banner */
        .privacy-strip {
            width: 100%;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }

        .privacy-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .privacy-item-icon {
            width: 14px;
            height: 14px;
            color: var(--accent-green);
        }

        .privacy-item-strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        @media (max-width: 540px) {
            .shortcuts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .privacy-strip {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <main class="home-container">
        <!-- Wordmark -->
        <header class="brand-header">
            <div class="brand-logo-row">
                <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                <h1 class="brand-name">Nexora</h1>
                <span class="brand-badge">Standalone Core</span>
            </div>
            <p class="brand-tagline">Local-first, memory-safe web browser. All data stored strictly on your device.</p>
        </header>

        <!-- Search Bar -->
        <section class="search-wrapper">
            <form class="search-box" id="home-search-form">
                <svg class="search-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/>
                </svg>
                <input 
                    type="text" 
                    class="search-input" 
                    id="home-search-input" 
                    placeholder="Enter website URL or search..." 
                    autocomplete="off" 
                    autofocus
                    aria-label="Web address or search"
                >
                <select class="search-engine-select" id="engine-select" aria-label="Search provider">
                    <option value="google" selected>Google Search</option>
                    <option value="direct">Direct Web / URL</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                </select>
            </form>
        </section>

        <!-- Quick Access -->
        <section class="shortcuts-grid" aria-label="Quick links">
            <a class="shortcut-card" href="https://github.com/Dardcor/Nexora">
                <svg class="shortcut-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/>
                </svg>
                <span class="shortcut-title">GitHub</span>
            </a>
            <a class="shortcut-card" href="https://rust-lang.org">
                <svg class="shortcut-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm0 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11ZM6.5 5.75a.75.75 0 0 0-1.5 0v4.5a.75.75 0 0 0 1.5 0v-4.5Zm4.5 0a.75.75 0 0 0-1.5 0v4.5a.75.75 0 0 0 1.5 0v-4.5Z"/>
                </svg>
                <span class="shortcut-title">Rust Lang</span>
            </a>
            <a class="shortcut-card" href="https://news.ycombinator.com">
                <svg class="shortcut-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M1 2.75C1 1.784 1.784 1 2.75 1h10.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 13.25 15H2.75A1.75 1.75 0 0 1 1 13.25V2.75Zm4.5 2.5 1.75 3.5v3.5h1.5v-3.5L10.5 5.25H9L8 7.5 7 5.25H5.5Z"/>
                </svg>
                <span class="shortcut-title">Hacker News</span>
            </a>
            <a class="shortcut-card" href="https://en.wikipedia.org">
                <svg class="shortcut-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25V2.75Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25H1.75Z"/>
                </svg>
                <span class="shortcut-title">Wikipedia</span>
            </a>
        </section>

        <!-- Privacy Status Guarantee -->
        <footer class="privacy-strip">
            <div class="privacy-item">
                <svg class="privacy-item-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16Zm3.78-9.72a.75.75 0 0 0-1.06-1.06L7 8.94 5.28 7.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.06 0l4.25-4.25Z"/>
                </svg>
                <span>Vault: <span class="privacy-item-strong">AES-256-GCM Local</span></span>
            </div>
            <div class="privacy-item">
                <svg class="privacy-item-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16Zm3.78-9.72a.75.75 0 0 0-1.06-1.06L7 8.94 5.28 7.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.06 0l4.25-4.25Z"/>
                </svg>
                <span>Shield: <span class="privacy-item-strong">Trackers Blocked</span></span>
            </div>
            <div class="privacy-item">
                <svg class="privacy-item-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16Zm3.78-9.72a.75.75 0 0 0-1.06-1.06L7 8.94 5.28 7.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.06 0l4.25-4.25Z"/>
                </svg>
                <span>Telemetry: <span class="privacy-item-strong">0% (Offline-First)</span></span>
            </div>
        </footer>
    </main>

    <script>
        const form = document.getElementById('home-search-form');
        const input = document.getElementById('home-search-input');
        const engineSelect = document.getElementById('engine-select');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = input.value.trim();
            if (!val) return;

            let targetUrl = val;
            const engine = engineSelect.value;

            if (val.includes('.') && !val.includes(' ')) {
                if (!val.startsWith('http://') && !val.startsWith('https://')) {
                    targetUrl = 'https://' + val;
                }
            } else if (val.startsWith('localhost') || val.startsWith('127.0.0.1')) {
                targetUrl = 'http://' + val;
            } else {
                switch(engine) {
                    case 'duckduckgo':
                        targetUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(val);
                        break;
                    case 'direct':
                        targetUrl = 'https://' + val;
                        break;
                    case 'google':
                    default:
                        targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(val);
                        break;
                }
            }

            window.location.href = targetUrl;
        });
    </script>
</body>
</html>
