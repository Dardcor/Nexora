<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads - Nexora</title>
    <style>
        :root {
            --bg-base: #1e1f22;
            --bg-surface: #2b2d31;
            --bg-hover: #35373c;
            --border-subtle: #383a40;
            --text-primary: #f2f3f5;
            --text-secondary: #949ba4;
            --accent-blue: #5865f2;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-stack);
            font-size: 13px;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-subtle);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex-shrink: 0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
        }

        .sidebar-brand svg {
            color: var(--accent-blue);
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.1s ease, color 0.1s ease;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background-color: rgba(88, 101, 242, 0.15);
            color: var(--accent-blue);
        }

        .main-content {
            flex: 1;
            padding: 2rem 2.5rem;
            overflow-y: auto;
            max-width: 900px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .downloads-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .file-icon {
            color: var(--accent-blue);
            flex-shrink: 0;
        }

        .file-details {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .file-url {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
                <path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14H2.75Z"/>
                <path d="M7.25 1.75v7.44L4.78 6.72a.75.75 0 0 0-1.06 1.06l3.75 3.75a.75.75 0 0 0 1.06 0l3.75-3.75a.75.75 0 1 0-1.06-1.06L8.75 9.19V1.75a.75.75 0 0 0-1.5 0Z"/>
            </svg>
            <span>Downloads</span>
        </div>
        <nav class="sidebar-menu">
            <a class="sidebar-item" href="nexora://history">Chrome History</a>
            <a class="sidebar-item" href="nexora://bookmarks">Bookmarks</a>
            <a class="sidebar-item active" href="nexora://downloads">Downloads</a>
            <a class="sidebar-item" href="nexora://settings">Settings</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1 class="page-title">Downloads</h1>
        <div class="downloads-list" id="downloads-container">
            <div class="empty-state">No active or previous downloads.</div>
        </div>
    </main>
</body>
</html>
