<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Browser</title>
    <link rel="stylesheet" href="shell.css">
</head>
<body>
    <div class="nexora-app">
        <!-- Top Navigation Bar -->
        <header class="nexora-header">
            <div class="nav-controls">
                <button class="nav-btn" id="btn-back" title="Go Back (Alt+Left)">&#x2190;</button>
                <button class="nav-btn" id="btn-forward" title="Go Forward (Alt+Right)">&#x2192;</button>
                <button class="nav-btn" id="btn-reload" title="Reload (Ctrl+R)">&#x21bb;</button>
                <button class="nav-btn" id="btn-home" title="New Tab Page">&#x2302;</button>
            </div>

            <!-- Omnibox URL / Search Bar -->
            <div class="omnibox-wrapper">
                <div class="omnibox-security-icon" id="security-icon" title="Local Encrypted Connection">&#x1f512;</div>
                <input 
                    type="text" 
                    class="omnibox-input" 
                    id="omnibox" 
                    placeholder="Search with DuckDuckGo or enter URL..." 
                    autocomplete="off"
                    spellcheck="false"
                >
                <div class="omnibox-actions">
                    <button class="omnibox-action-btn" id="btn-reader" title="Toggle Nexora Nano Reader Mode">&#x1f4d6;</button>
                    <button class="omnibox-action-btn" id="btn-bookmark" title="Bookmark This Page">&#x2606;</button>
                </div>
            </div>

            <div class="header-right">
                <!-- Nexora Shield Button -->
                <button class="shield-btn" id="shield-toggle" title="Nexora Shield Privacy Dashboard">
                    <span class="shield-icon">&#x1f6e1;</span>
                    <span class="shield-badge" id="shield-count">0</span>
                </button>

                <!-- Sidebar Toggle -->
                <button class="nav-btn" id="btn-toggle-sidebar" title="Toggle Vertical Tabs (Ctrl+B)">&#x2630;</button>
            </div>
        </header>

        <!-- Main Body: Sidebar + Webview Frame -->
        <div class="nexora-main">
            <!-- Vertical Tabs Sidebar -->
            <aside class="nexora-sidebar" id="sidebar">
                <!-- Spaces / Containers Selector -->
                <div class="spaces-bar">
                    <button class="space-tab active" data-space="personal" title="Personal Space">
                        <span class="space-dot" style="background-color: #3b82f6;"></span>
                        <span class="space-name">Personal</span>
                    </button>
                    <button class="space-tab" data-space="work" title="Work Space">
                        <span class="space-dot" style="background-color: #10b981;"></span>
                        <span class="space-name">Work</span>
                    </button>
                    <button class="space-tab" data-space="dev" title="Code & Research">
                        <span class="space-dot" style="background-color: #8b5cf6;"></span>
                        <span class="space-name">Dev</span>
                    </button>
                </div>

                <!-- Tabs Management -->
                <div class="sidebar-header">
                    <span class="sidebar-title">Tabs</span>
                    <button class="new-tab-btn" id="btn-new-tab" title="Open New Tab (Ctrl+T)">+ New Tab</button>
                </div>

                <div class="tab-list" id="tab-list">
                    <!-- Dynamic tabs injected by JS -->
                </div>

                <!-- Memory & Local Vault Health Widget -->
                <div class="vault-status-card">
                    <div class="vault-status-row">
                        <span class="status-label">RAM Usage:</span>
                        <span class="status-val" id="mem-usage">~62 MB</span>
                    </div>
                    <div class="vault-status-row">
                        <span class="status-label">Hibernated:</span>
                        <span class="status-val" id="hibernated-count">0 tabs</span>
                    </div>
                    <div class="vault-status-row">
                        <span class="status-label">Storage:</span>
                        <span class="status-val success">100% Local Encrypted</span>
                    </div>
                </div>
            </aside>

            <!-- Webview Display Area -->
            <main class="webview-container" id="webview-container">
                <iframe id="main-frame" src="newtab.html" frameborder="0"></iframe>
            </main>
        </div>

        <!-- Nexora Shield Flyout Modal -->
        <div class="shield-modal" id="shield-modal">
            <div class="shield-modal-header">
                <h3>Nexora Shield</h3>
                <span class="shield-version">Active Protection</span>
            </div>
            <div class="shield-metrics">
                <div class="metric-item">
                    <span class="metric-number" id="modal-trackers">0</span>
                    <span class="metric-label">Trackers Blocked</span>
                </div>
                <div class="metric-item">
                    <span class="metric-number" id="modal-data-saved">0 KB</span>
                    <span class="metric-label">Data Saved</span>
                </div>
            </div>
            <div class="shield-switches">
                <label class="switch-row">
                    <span>Block Trackers & Ads</span>
                    <input type="checkbox" id="chk-adblock" checked>
                </label>
                <label class="switch-row">
                    <span>Anti-Fingerprinting Noise</span>
                    <input type="checkbox" id="chk-fingerprint" checked>
                </label>
                <label class="switch-row">
                    <span>Strip Tracking URL Tags</span>
                    <input type="checkbox" id="chk-params" checked>
                </label>
            </div>
        </div>
    </div>

    <script src="shell.js"></script>
</body>
</html>
